#Base engine throughput and size scaling.
[engine]
	#Base static thrust produced by each unit of engine flow.
	# Default: 465.0
	# Range: 0.0 ~ 100000.0
	thrust_per_flow = 465.0
	#Base exhaust airflow. Higher values let engines sustain thrust at greater vehicle speed.
	# Default: 60.0
	# Range: 0.0 ~ 10000.0
	airflow_per_flow = 60.0
	#Fuel demand in mB/s for each unit of engine flow before family multipliers.
	# Default: 48.0
	# Range: 0.1 ~ 10000.0
	base_fuel_per_flow = 48.0
	#How strongly larger engine cross-sections improve thrust efficiency.
	# Default: 0.6666666666666666
	# Range: 0.0 ~ 3.0
	size_efficiency_exponent = 0.6666666666666666
	#Upper limit for the efficiency bonus from engine size or repeated stages.
	# Default: 3.697926796536718
	# Range: 1.0 ~ 100.0
	max_size_efficiency = 3.697926796536718
	#Flow capacity multiplier applied to compressor stages.
	# Default: 1.1
	# Range: 0.0 ~ 100.0
	compressor_flow_multiplier = 1.1
	#Flow capacity multiplier applied to combustion chambers.
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	combustion_flow_multiplier = 1.0
	#Flow capacity multiplier applied to turbofan turbine stages.
	# Default: 1.15
	# Range: 0.0 ~ 100.0
	turbine_flow_multiplier = 1.15
	#Maximum effective airflow multiplier from a fully sized shock-cone inlet. This preserves more thrust at high vehicle speed without increasing static thrust.
	# Default: 1.5
	# Range: 1.0 ~ 10.0
	inlet_high_speed_airflow_multiplier = 1.5

#Performance multipliers for assembled turbofan engines.
[turbofan]
	#Multiplier applied to turbofan static thrust.
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	thrust_multiplier = 1.0
	#Multiplier applied to turbofan airflow and sustainable speed.
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	airflow_multiplier = 1.0
	#Multiplier applied to turbofan fuel consumption.
	# Default: 1.0
	# Range: 0.01 ~ 100.0
	fuel_demand_multiplier = 1.0
	#Atmospheric pressure exponent. 1 uses raw pressure; lower values reduce altitude sensitivity.
	# Default: 1.0
	# Range: 0.0 ~ 4.0
	pressure_exponent = 1.0

#Performance multipliers for assembled turbojet engines.
[turbojet]
	#Multiplier applied to turbojet static thrust.
	# Default: 1.35
	# Range: 0.0 ~ 100.0
	thrust_multiplier = 1.35
	#Multiplier applied to turbojet airflow and sustainable speed.
	# Default: 1.6
	# Range: 0.0 ~ 100.0
	airflow_multiplier = 1.6
	#Multiplier applied to turbojet fuel consumption.
	# Default: 1.75
	# Range: 0.01 ~ 100.0
	fuel_demand_multiplier = 1.75
	#Atmospheric pressure exponent. Lower values make turbojets retain more thrust at altitude.
	# Default: 0.6
	# Range: 0.0 ~ 4.0
	pressure_exponent = 0.6

#Output and fuel demand while a redstone-powered afterburner stage is installed.
[afterburner]
	#Total thrust multiplier while at least one afterburner stage is powered.
	# Default: 1.45
	# Range: 1.0 ~ 10.0
	afterburner_thrust_multiplier = 1.45
	#Total effective exhaust-airflow multiplier while the afterburner is powered.
	# Default: 1.3
	# Range: 1.0 ~ 10.0
	afterburner_airflow_multiplier = 1.3
	#Total fuel-demand multiplier while the afterburner is powered.
	# Default: 1.6
	# Range: 1.0 ~ 10.0
	afterburner_fuel_demand_multiplier = 1.6

#Fuel buffering and response to changing pipe delivery rates.
[throttle]
	#Maximum fuel buffered by a mount, measured in seconds of full-power demand.
	# Default: 0.1
	# Range: 0.05 ~ 10.0
	fuel_buffer_seconds = 0.1
	#How quickly thrust rises when fuel delivery increases.
	# Default: 0.35
	# Range: 0.01 ~ 1.0
	rise_response = 0.35
	#How quickly thrust falls when fuel delivery decreases.
	# Default: 0.5
	# Range: 0.01 ~ 1.0
	fall_response = 0.5
	#Sensitivity to partial fuel delivery. Higher values reduce thrust more sharply at low pump rates.
	# Default: 1.0
	# Range: 0.1 ~ 4.0
	delivery_exponent = 1.0

#Thrust energy multipliers for supported fuels. Zero disables a fuel.
[fuels]
	#Thrust multiplier for lava.
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	lava = 1.0
	#Thrust multiplier for diesel.
	# Default: 3.15
	# Range: 0.0 ~ 100.0
	diesel = 3.15
	#Thrust multiplier for kerosene.
	# Default: 3.0
	# Range: 0.0 ~ 100.0
	kerosene = 3.0
	#Thrust multiplier for biodiesel.
	# Default: 2.9
	# Range: 0.0 ~ 100.0
	biodiesel = 2.9
	#Thrust multiplier for gasoline.
	# Default: 2.8
	# Range: 0.0 ~ 100.0
	gasoline = 2.8
	#Thrust multiplier for plantoil.
	# Default: 2.7
	# Range: 0.0 ~ 100.0
	plantoil = 2.7
	#Thrust multiplier for naphtha.
	# Default: 2.7
	# Range: 0.0 ~ 100.0
	naphtha = 2.7
	#Thrust multiplier for lpg.
	# Default: 2.1
	# Range: 0.0 ~ 100.0
	lpg = 2.1
	#Thrust multiplier for ethanol.
	# Default: 1.9
	# Range: 0.0 ~ 100.0
	ethanol = 1.9
	#Thrust multiplier for creosote.
	# Default: 1.2
	# Range: 0.0 ~ 100.0
	creosote = 1.2
	#Thrust multiplier for furnace gas.
	# Default: 0.9
	# Range: 0.0 ~ 100.0
	furnace_gas = 0.9

#Exhaust wind, animation, and particle presentation.
[effects]
	#Maximum Create air-current speed emitted from an active engine.
	# Default: 256.0
	# Range: 0.0 ~ 4096.0
	max_exhaust_wind_speed = 256.0
	#Minimum component animation speed while an engine is active.
	# Default: 96.0
	# Range: 0.0 ~ 4096.0
	visual_speed_base = 96.0
	#Additional component animation speed per unit of engine airflow.
	# Default: 0.95
	# Range: 0.0 ~ 100.0
	visual_speed_per_airflow = 0.95
	#Maximum compressor, shaft, and turbine animation speed.
	# Default: 256.0
	# Range: 0.0 ~ 4096.0
	visual_speed_max = 256.0
	#Whether active engines emit exhaust particles.
	exhaust_particles_enabled = true
	#Multiplier for the number of exhaust particles emitted.
	# Default: 1.0
	# Range: 0.0 ~ 10.0
	exhaust_particle_density = 1.0
	#Multiplier for exhaust particle launch velocity.
	# Default: 1.0
	# Range: 0.0 ~ 10.0
	exhaust_particle_speed = 1.0
	#Multiplier for exhaust particle diameter.
	# Default: 1.0
	# Range: 0.05 ~ 10.0
	exhaust_particle_size = 1.0
	#Hard per-engine limit for turbofan smoke particles emitted each tick.
	# Default: 24
	# Range: 0 ~ 512
	max_smoke_particles_per_tick = 24
	#Hard per-engine limit for hot or core exhaust particles emitted each tick.
	# Default: 24
	# Range: 0 ~ 512
	max_core_particles_per_tick = 24
	#Maximum turbofan exhaust spawn radius in blocks.
	# Default: 1.15
	# Range: 0.05 ~ 16.0
	max_exhaust_radius = 1.15
	#Thrust value used as the baseline for exhaust density and particle speed.
	# Default: 1200.0
	# Range: 1.0 ~ 1000000.0
	exhaust_reference_thrust = 1200.0
	#Additional exhaust plume radius multiplier for turbojets.
	# Default: 1.35
	# Range: 0.05 ~ 10.0
	turbojet_radius_multiplier = 1.35
	#Fraction of the turbojet exhaust radius used to spawn its hot core.
	# Default: 0.18
	# Range: 0.0 ~ 1.0
	turbojet_core_radius_factor = 0.18

#Limits for discovering and revalidating assembled engine lines.
[assembly]
	#Ticks between automatic structure checks for an assembled engine.
	# Default: 20
	# Range: 1 ~ 1200
	scan_interval_ticks = 20
	#Maximum number of contiguous components in one engine line.
	# Default: 32
	# Range: 4 ~ 256
	max_engine_length = 32
